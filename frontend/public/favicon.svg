<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7300" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="favFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <linearGradient id="favNest" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="1.2" />

  <!-- FitNest Emblem (Scaled & simplified for high legibility at 16px/32px) -->
  <g transform="translate(0, 0)">
    <!-- Nest Cradle -->
    <path d="M 11 26
             C 11 33, 16 38.5, 24 38.5
             C 32 38.5, 37 34, 38 27
             C 38.5 23, 37 20, 35 18
             C 34.5 21, 34 26, 30.5 30.5
             C 27.5 34, 23 34.5, 18.5 32.5
             C 15 30.5, 13.5 27.5, 13 24.5
             Z"
          fill="url(#favNest)" />

    <!-- "F" Wing -->
    <path d="M 13 23.5
             C 13 17.5, 16 12, 21.5 8.5
             C 20 13.5, 19 17.5, 20 21.5
             L 28 19.5
             L 25 24
             C 21 25, 19 25, 17 24.5
             Z"
          fill="url(#favFlame)" />

    <!-- Central Flame Spark -->
    <path d="M 23 32
             C 22.5 30, 21.5 27, 22 23
             C 22.5 18, 26 13, 25 8
             C 29 11.5, 32 17, 31 22
             C 30 26, 28 29, 26 31
             Z"
          fill="url(#favFlame)" />

    <!-- Core Radiant Ember -->
    <circle cx="25.5" cy="10" r="1.2" fill="#ffe6a7" />
  </g>
</svg>
